[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-arta"
version = "0.1.0"
description = "Send a Samsung The Frame TV to Art Mode (instead of off) when the Apple TV goes to sleep."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "pyatv>=0.14",
    # srptools 2.0 changed its API and breaks pyatv 0.18 Apple TV pairing.
    "srptools<2",
    "samsungtvws>=2.6",
    "wakeonlan>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ad-arta = "ad_arta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
